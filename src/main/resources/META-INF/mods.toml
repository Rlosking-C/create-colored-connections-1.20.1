modLoader = "javafml"

loaderVersion = "[47,)"
license = "MIT"

[[mods]]
modId = "create_colored_connections"

version = "${mod_version}"
displayName = "Create: Colored Connections"
authors = "Rlosking-C"

logoFile = "icon.png"
description = '''
Colorize Factory Gauge recipe links with the 16 vanilla dyes, so heavily
crossed networks stay readable at a glance. Forge 1.20.1 port of the
NeoForge 1.21.1 original.

Works with Create 6.0.0 - 6.0.8 for 1.20.1.

Playing with Factory Controller too? Its wires become dyeable in the
controller GUI - but Factory Controller itself needs Create 6.0.3 or
newer, because on Create 6.0.0 - 6.0.2 its own mixins fail to load.
'''

[[dependencies.create_colored_connections]]
    modId = "forge"
    mandatory = true
    versionRange = "[47,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.create_colored_connections]]
    modId = "minecraft"
    mandatory = true
    versionRange = "[1.20.1,1.21)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.create_colored_connections]]
    modId = "create"
    mandatory = true
    versionRange = "[6.0.0,6.0.9)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.create_colored_connections]]
    modId = "createfactorycontroller"
    mandatory = false
    versionRange = "[1.2.1,)"
    ordering = "AFTER"
    side = "BOTH"
