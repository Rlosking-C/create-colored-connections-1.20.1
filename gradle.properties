# Gradle build settings
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## Environment
# Verified against maven.createmod.net: create-1.20.1 stops at 6.0.8-*.
# (6.0.9 / 6.0.10 are 1.21.1-only - see docs/port-to-1.20.1-forge.md section 2.1.)
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.3.25
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

## Mod properties
mod_id=create_colored_connections
mod_name=Create: Colored Connections
mod_license=MIT
# Version scheme: <minecraft version>-<mod version>. The 1.21.1 main line ships the
# same feature set as plain "0.5.0", so this port identifies itself by prefixing the
# platform it was built for. Both halves are upstream of what Forge needs:
#   - FML validates a mod version against ^\d+.* - it only has to start with a digit,
#     so "1.20.1-0.5.0" is accepted;
#   - Forge compares versions with Maven's rules, where "1.20.1-0.5.0" sorts correctly
#     among its own kind (above 1.20.1-0.4.x, below 1.20.1-0.5.1).
# One quirk to know before writing any *dependency* on this mod: by the same Maven
# rules "1.20.1-0.5.0" compares as OLDER than the bare number 47, so a range like
# "[1.20.1-0.5.0,)" would not mean what it looks like. Nothing in this project depends
# on its own version that way.
mod_version=1.20.1-0.5.0
mod_group_id=com.colconn
mod_authors=Rlosking-C
# NO mod_description HERE, deliberately. The description shown in the in-game mod list
# is the literal text block in src/main/resources/META-INF/mods.toml. This file cannot
# feed it: the processResources expand() step (see build.gradle) only injects
# minecraft_version, forge_version and mod_version, and mods.toml's only placeholder is
# ${mod_version}. A description here would be dead text that silently drifts out of sync
# with the one players actually see, so it lives in exactly one place - mods.toml.

## Dependencies
# Create 1.20.1 line (latest published build of the 6.0.8 line).
# The *runtime* jar comes from Modrinth (maven.createmod.net publishes a POM only),
# so the dev-run jar is dropped into run/mods/ manually - see README.md.
create_version=6.0.8-291
# Lower bound 6.0.0 = what THIS MOD's own code needs (whole source compiles clean
# against a 6.0.0 jar, verified - see docs section 8.17).
#
# The OPTIONAL Factory Controller integration needs Create 6.0.3 instead. FC 1.2.1
# (and the Create: Logistics Control jar it bundles) target StockTickerBlockEntity
# methods whose signatures use PackageOrderWithCrafts, which Create only introduced in
# 6.0.3; on 6.0.0/6.0.1/6.0.2 those mixins die during mod loading with
# NoClassDefFoundError / ClassMetadataNotFoundException, and the crash points at FC.
#
# That floor is deliberately NOT encoded below. A mods.toml range cannot be
# conditional on another optional mod being installed, so raising it would lock out
# players on 6.0.0 - 6.0.2 who never install FC. The requirement lives in the mod
# description and in docs/port-to-1.20.1-forge.md section 8.19 instead.
#
# Upper bound stays below 6.0.9: 6.0.9/6.0.10 are 1.21.1-only builds.
# Forge matches the version Create declares in its own mods.toml ("6.0.8-291");
# the "1.20.1-6.0.8" spelling is only Modrinth's display name.
create_version_range=[6.0.0,6.0.9)
# Factory Controller for 1.20.1 (optional integration, see FCCompatMixinPlugin).
# Requires Create >= 6.0.3 at runtime, but that floor is not in create_version_range
# above on purpose - see the note there. FC below 1.2.1 is silently disabled.
fc_version=1.2.1-forge-1.20.1
fc_version_range=[1.2.1,)

## Libraries Create re-exports (exact versions from Create's own JarJar metadata,
## see docs/port-to-1.20.1-forge.md section 2.4 - do not guess these).
# Ponder carries Catnip (net.createmod.catnip.*).
ponder_version=1.0.91
# NOTE the group is dev.engine-room.flywheel (hyphen), NOT dev.engine_room.* -
# the latter is the package name and resolves to a 404.
flywheel_version=1.0.6-beta-266
# Registrate: served by https://maven.ithundxr.dev/mirror (the Create wiki's URL).
# The /snapshots path that the 1.21.1 build uses does NOT resolve on this machine.
registrate_version=MC1.20-1.3.3

# MixinExtras provides @WrapOperation; compile-only for the API, the runtime copy
# is JiJ'd into the final jar (see build.gradle jarJar config).
mixinextras_version=0.4.1
